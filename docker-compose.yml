services:
  backend:
    build: ./backend
    container_name: llm-watermarking-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - huggingface-cache:/root/.cache/huggingface
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: llm-watermarking-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  huggingface-cache: